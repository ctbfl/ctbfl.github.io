"}]}]\n16:T1778,"])</script><script>self.__next_f.push([1,"## 0. Preface\n\nThis article provides a concise reference for deploying the Pi0 series models.\n\nWe adopt a CS (Client-Server) architecture:\n\n- Client: only handles robot action commands as input, and environment/robot feedback/observations as output (and runs the simulator/real world)\n- Server: focuses on model inference, receiving feedback/observations from the client and outputting new action commands.\n\nSo you will see that we use two virtual environments later:\none for model execution, one for the simulator, and they communicate with each other via web interfaces.\n\n## 1. Clone the Project\n\n```bash\ngit clone --recurse-submodules git@github.com:Physical-Intelligence/openpi.git\ncd openpi\n````\n\n* Here `--recurse-submodules` means recursive cloning; it will clone all referenced sub-repositories in the repo.\n* Unless otherwise specified, all commands below are executed in the project root directory.\n\n## 2. Environment Setup\n\n### 2.1 Install uv\n\n* **uv** is a new Python package and environment manager developed by Astral (formerly the PyO3 team).\n  Its features: extremely fast, all-in-one, and can replace the combination of `pip + venv (virtualenv) + pip-tools` (the speed comes from Rust implementation + local caching + parallelism).\n\n```bash\nconda create -n uv_envs python=3.10\nconda activate uv_envs\npip install uv\n```\n\n* The steps above are mainly to create a “shell” environment for running uv.\n  This conda environment `uv_envs` itself will not be used to execute any project code; it only hosts the uv tool and lets you run uv inside it.\n\n### 2.2 Install Main Project Environment (Server)\n\n```bash\nGIT_LFS_SKIP_SMUDLE=1 uv sync\n```\n\n* `openpi/` is the project root, which contains the project configuration file `pyproject.toml`.\n  `pyproject.toml` is the modern unified configuration file for Python projects, used to declare dependencies, build system, and tooling, replacing scattered `setup.py` and `requirements.txt`.\n\n* `GIT_LFS_SKIP_SMUDGE=1` is a temporary environment variable set for the current command only (only effective on this line), recognized by Git LFS.\n  When enabled, `git clone` or `git pull` will not automatically download large files managed by LFS, but only fetch their pointer files, which speeds up syncing and reduces bandwidth usage.\n  If you later need the actual large binary files, you can manually run `git lfs pull` to download them.\n\n* `uv sync` will create a `.venv` virtual environment folder under the project directory and install all required packages based on `pyproject.toml`.\n\n```bash\nsource .venv/bin/activate\n```\n\nThis activates the project-level virtual environment created by uv.\nAt the Python level, this environment completely replaces the previously activated conda environment.\nEven if you see two environment names in your shell prompt, only the most recently activated one is effective.\n\n![image-20251128204035983](/blog/reproducing-pi0-5-simulator/image-20251128204035983.png)\n\n\u003e 🧩 When a venv is stacked on top of a conda environment:\n\u003e\n\u003e * The Python executable is completely replaced.\n\u003e * Python’s import path depends on the configuration inside the Python executable, so all available packages now come from the new venv.\n\u003e * The system `$PATH` is stacked, not replaced, so you can still use the `uv` command in the new environment — the system will find the `uv` executable from the conda environment’s path.\n\u003e * When you run `python`, the system searches `PATH` from front to back; since the latest environment is at the front, it will use the most recently activated Python environment.\n\n### 2.3 Install LIBERO Environment (Client)\n\nSince we will first do inference tests in the LIBERO environment, which has its own dependencies, it is better to create a separate virtual environment for it.\n\n```bash\nconda activate uv_envs # if you are not already in this conda environment\nuv venv --python 3.8 examples/libero/.venv\nsource examples/libero/.venv/bin/activate\n```\n\nWe first create a new virtual environment under the `examples/libero` folder.\n\nThen we activate this new virtual environment, so you should see `(.venv)` appearing in front of `(uv_envs)` in your prompt.\n\nNext, install the dependencies:\n\n```bash\nuv pip sync exmaples/libero/requirements.txt third_party/libero/requirements.txt --extra-index-url https://download.pytorch.org/whl/cu113 --index-strategy=unsafe-best-match\n```\n\n* `uv pip sync` is a uv command that synchronizes the virtual environment’s libraries to exactly match your `requirements.txt` files.\n  It also supports multiple requirements files at once (it will merge them and try to find the best solution).\n* The last two parameters are for compatibility with the specified PyTorch CUDA wheels.\n\nNext, install submodules as local editable packages:\n\n```bash\nuv pip install -e packages/openpi-client\nuv pip install -e third_party/libero\n```\n\nLIBERO also requires an environment variable:\n\n```bash\nexport PYTHONPATH=$PYTHONPATH:$PWD/third_party/libero\n```\n\n* You can test with `python -m libero`.\n\n## 3. Simple Run\n\nFirst start the server:\n\n```bash\nsource .venv/bin/activate # make sure you are in the server environment\npython scripts/serve_policy.py --env LIBERO\n```\n\n* Here `--env` selects one of the pretrained policy weights provided by Physical Intelligence. Available options: `ALOHA`, `ALOHA_SIM`, `DROID`, `LIBERO`.\n\n* In the [source code](https://github.com/Physical-Intelligence/openpi/blob/3e0325a5e6032a9ab6beef7395fe47ca724980a5/scripts/serve_policy.py), the default command-line arguments are defined in class `Args`, and `tyro.cli(Args)` is used to merge user-provided CLI arguments with these defaults.\n\n  ![image-20251128220831692](/blog/reproducing-pi0-5-simulator/image-20251128220831692.png)\n\nThen open another terminal (keeping the original server terminal running) and start the client:\n\n```bash\npython examples/libero/main.py\n```\n\nThis example script will automatically run a test. After waiting for a while, you will get a video showing the execution result.\n"])</script><script>self.__next_f.push([1,"17:T1552,"])</script><script>self.__next_f.push([1,"## 0. 前言\n\n本文尝试提供一个简洁的部署Pi0系列模型的参考。\n\n采用 CS (Client-Server) 架构，\n\n- 客户端Client：只管机器人动作指令的输入，环境/机器人本体反馈/观察的输出（以及simulator/现实世界的运行)\n- 服务器端Server：则专注于模型推理，接受客户端的反馈/观察数据，给出新的动作指令。\n\n所以你会看到，我们后面用了两个虚拟环境，一个管模型运行，一个管Simulator运行，他们之间通过Web接口互相传递数据。\n\n## 1. 克隆项目\n\n```bash\ngit clone --recurse-submodules git@github.com:Physical-Intelligence/openpi.git\ncd openpi\n```\n\n- 这里--recurse-submodules代表迭代clone，会把仓库中所有引用的子仓库都clone下来。\n- 如无特殊说明，下面所有命令均在项目根目录执行。\n\n## 2. 安装环境\n\n### 2.1 安装uv\n\n- uv 是一个新兴的 Python 包管理和环境管理工具，由 Astral（原 PyO3 团队）开发。它的特点：极快、全能、替代 pip + venv（虚拟环境） + pip-tools 的组合（速度优势来自 Rust 实现 + 本地缓存 + 并行）\n\n```bash\nconda create -n uv_envs python=3.10\nconda activate uv_envs\npip install uv\n```\n\n- 上面这些步骤主要是为了创造一个用来运行 uv 的壳环境。这个conda环境`uv_envs`本身不会用来执行任何代码，只是在这个`uv_envs`里面安装uv工具，使用uv工具。\n\n### 2.2 安装项目主环境（Server端）\n\n```bash\nGIT_LFS_SKIP_SMUDLE=1 uv sync\n```\n\n- `openpi/`作为项目根目录，其中有一个pyproject.toml项目配置文件。`pyproject.toml`是现代 Python 项目的统一配置文件，用来声明项目依赖、构建方式和开发工具设置，取代分散的 setup.py 和 requirements.txt。\n- `GIT_LFS_SKIP_SMUDGE=1` 是一个为当前命令设置的临时环境变量（只在这一行有效），由 Git LFS 识别。\n  当启用该变量时，执行 `git clone` 或 `git pull` 时不会自动下载 LFS 管理的大文件，而是只获取它们的指针文件（pointer files），从而加快同步速度、减少带宽占用。\n   如果后续需要实际的二进制大文件，可手动运行 `git lfs pull` 完成下载。\n\n- `uv sync`会在项目文件夹下新建虚拟环境文件夹`.venv`，根据项目配置文件`pyproject.toml`自动安装所需的库。\n\n```bash\nsource .venv/bin/activate\n```\n\n这将会激活刚刚uv创建的这个项目级的虚拟环境。此环境在python层面会完全替代原本激活的conda环境。尽管你可能在命令行看到前面有两个环境，但只有最新激活的这个是有效的。\n\n![image-20251128204035983](/blog/reproducing-pi0-5-simulator/image-20251128204035983.png)\n\n\u003e🧩 当venv叠加在conda环境上时\n\u003e\n\u003e- Python executable被完全替换\n\u003e- Python用来找包的路径依赖于python executable内部的配置，所以所有可用包都被替换为新环境的\n\u003e- 系统的$PATH是叠加而非替代，所以你仍然可以在新环境里面使用uv指令，因为系统会在conda环境的路径下找到uv包的可执行文件来执行。\n\u003e- 当你使用python时，系统自动在path里面从前往后找python executeable，由于最新加的环境在最前面，所以会使用最新激活的这个python环境。\n\n### 2.3 安装LIBERO环境（Client端）\n\n因为本文中首先在LIBERO虚拟环境中进行推理测试，其有自己的依赖项所以最好也自己搞一个虚拟环境。\n\n```bash\nconda activate uv_envs #如果你没有在这个conda环境里\nuv venv --python 3.8 examples/libero/.venv\nsource examples/libero/.venv/bin/activate\n```\n\n我们首先在`examples/libero`文件夹中又创建了一个新的虚拟环境。\n\n随后激活了新的虚拟环境，所以你应该看到`(.venv)`出现在`(uv_envs)`的前面。\n\n然后我们安装依赖项\n\n```bash\nuv pip sync exmaples/libero/requirements.txt third_party/libero/requirements.txt --extra-index-url https://download.pytorch.org/whl/cu113 --index-strategy=unsafe-best-match\n```\n\n- `uv pip sync` 是一个uv命令，会将虚拟环境中的依赖库同步成和你的requirements.txt完全一致。并且还支持多个requirements文件一起（他会智能合并找最优方案）。\n- 后面的两个参数是为了保证兼容性\n\n接下来将子模块以包的形式安装在本地\n\n```bash\nuv pip install -e packages/openpi-client\nuv pip install -e third_party/libero\n```\n\nLibero的代码运行还需要加个环境变量\n\n```bash\nexport PYTHONPATH=$PYTHONPATH:$PWD/third_party/libero\n```\n\n- 可使用`python -m libero`测试\n\n## 3. 简单运行\n\n首先启动server:\n\n```bash\nsource .venv/bin/activate #要在server的环境中\npython scripts/serve_policy.py --env LIBERO\n```\n\n- 这里--env是选择一系列Physical Intelligence提供的训练好的模型权重，可选`ALOHA`， `ALOHA_SIM`，`DROID`，`LIBERO`。\n\n- [源码](https://github.com/Physical-Intelligence/openpi/blob/3e0325a5e6032a9ab6beef7395fe47ca724980a5/scripts/serve_policy.py)里面，默认命令行参数是设置在class Args里面，使用`tyro.cli(Args)`来将用户的命令行参数和默认参数融合。\n\n  ![image-20251128220831692](/blog/reproducing-pi0-5-simulator/image-20251128220831692.png)\n\n然后再开一个终端（保持原来这个开启），启动client：\n\n```\npython examples/libero/main.py\n```\n\n这个样例代码会自动跑一个测试，等待一段时间后你会得到执行结果的视频。\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$12\",null,{\"fallback\":null,\"children\":[\"$\",\"$L15\",null,{\"meta\":{\"title\":\"Reproducing Pi0.5 in Simulator\",\"title_cn\":\"模拟器复现Pi0.5攻略\",\"subtitle\":\"\",\"subtitle_cn\":\"\",\"date\":\"2025-11-30\",\"tags\":[\"Practice\",\"Pi0\",\"VLA\"]},\"contentEn\":\"$16\",\"contentCn\
